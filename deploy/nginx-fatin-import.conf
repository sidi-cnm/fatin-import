# Nginx : reçoit les appels HTTPS du CMS et les passe à l'API (qui écoute seulement en local).
# Copier dans /etc/nginx/sites-available/fatin-import, remplacer import.fatin.mr par votre adresse.
server {
    listen 80;
    server_name import.fatin.mr;

    client_max_body_size 200M;      # les gros manuels (le PDF de maths fait 37 Mo)
    proxy_read_timeout 600s;        # le plan du livre peut prendre quelques minutes
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
